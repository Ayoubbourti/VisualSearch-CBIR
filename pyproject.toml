[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["webapp/instance", "data", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
  "E501",    # longueur de ligne : gérée par le formatage
  "S101",    # assert : usage normal dans les tests et pour les invariants internes
  "S608",    # SQL construit avec des « ? » générés : valeurs toujours paramétrées
  "UP037", "UP006", "UP007", "UP035", "UP045",
  "I001",
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "E731", "E402", "E401", "B011", "B017", "F401", "E702", "S324"]
"scripts/*" = ["S311", "E402"]
"webapp/__init__.py" = ["E402"]
"api/app.py" = ["E402"]
"docs/*" = ["E402", "E702", "S603"]   # scripts de génération du rapport (mise en forme compacte)
